name: CI

permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Cache forge artifacts
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        # pipefail so an over-EIP-170 contract fails the step here; without it `tee` returns 0
        # and the oversize only surfaces later as a failed deployment.
        run: |
          set -o pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          forge build --sizes | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run tests and check gas snapshot
        run: forge snapshot --check --tolerance 1 --no-match-contract Invariant --fuzz-seed 0x1 --threads 2 -vvv

      - name: Run invariant tests
        run: forge test --match-contract Invariant -vvv

      - name: Check per-call gas snapshots have not drifted
        run: git diff --exit-code snapshots/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Observability script unit tests (no chain)
        run: python -m pytest scripts/tests
