name: E2E Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  scenarios:
    name: Compile check and scenario list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile-check Python scripts
        run: python -m py_compile scripts/*.py scripts/tests/*.py e2e/*.py e2e/alpha_e2e/*.py e2e/tests/*.py

      - name: List scenario modules
        id: list
        working-directory: e2e
        run: echo "files=$(ls tests/test_*.py | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  e2e:
    name: Localnet E2E (${{ matrix.scenario }})
    needs: scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Each scenario gets its own fresh subtensor service container, so state a scenario
        # changes on chain, such as the transfer toggles it switches off, cannot reach another.
        scenario: ${{ fromJSON(needs.scenarios.outputs.files) }}

    services:
      subtensor:
        image: ghcr.io/raofoundation/subtensor-localnet:main@sha256:c3bd611f395fe31f72fde964d8e0b99a2c7221c5508eec7d61bbafaba0374dc5
        ports:
          - 9944:9944
          - 9945:9945

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Cache forge artifacts
        uses: actions/cache@v6
        with:
          path: |
            out
            cache
          key: forge-${{ runner.os }}-ci-${{ hashFiles('foundry.toml', 'src/**/*.sol', 'test/**/*.sol', 'lib/**') }}
          restore-keys: forge-${{ runner.os }}-ci-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: e2e/install-deps.sh

      - name: Wait for subtensor to be ready
        run: |
          echo "Waiting for subtensor localnet..."
          for i in $(seq 1 30); do
            if cast chain-id --rpc-url http://127.0.0.1:9944 2>/dev/null; then
              echo "Subtensor is ready!"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 2
          done
          echo "Subtensor failed to start"
          exit 1

      - name: Run E2E test
        working-directory: e2e
        # -s so the scenarios' own output, the per-call gas lines included, reaches the log;
        # pipefail so a failing run still fails the step through the tee.
        run: |
          set -o pipefail
          python -m pytest ${{ matrix.scenario }} -v -s -m scenario --tb=short | tee /tmp/e2e.log

      - name: Report on-chain gas per call
        if: always()
        # Real precompile costs, which no local run can measure. One row per broadcast call.
        run: |
          if grep -q 'GAS |' /tmp/e2e.log; then
            {
              echo "## On-chain gas: ${{ matrix.scenario }}"
              echo '```'
              grep 'GAS |' /tmp/e2e.log | sed 's/^ *GAS | *//'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect subtensor logs
        if: failure()
        # The service key is only a network alias; docker knows the container by
        # its runner-generated id.
        run: docker logs "${{ job.services.subtensor.id }}" 2>&1 | tail -100 || true
