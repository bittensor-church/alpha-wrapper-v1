[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

fuzz = { runs = 256 }

# Fuzz gas is snapshotted, so the input stream must not vary: the seed does not pin values drawn from the build's
# dictionary, and the stream depends on the thread count (the CI runner has 2 vCPUs). See test/README.md.
[profile.ci]
gas_snapshot_check = true
threads = 2

[profile.ci.fuzz]
runs = 256
seed = "0x1"
dictionary_weight = 0


[fmt]
ignore = ["src/**"]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
bittensor = "${BITTENSOR_RPC_URL}"
bittensor_testnet = "${BITTENSOR_TESTNET_RPC_URL}"

[etherscan.bittensor]
chain = 8299
url = "https://evm.taostats.io/api/"
key = "${BITTENSOR_API_KEY}"
